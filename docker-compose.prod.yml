services:
  backend:
    image: ${DOCKER_IMAGE_BACKEND:-noderift-backend:latest}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      FRONTEND_URL: ${FRONTEND_URL}
      GOOGLE_AUTH_URL: ${GOOGLE_AUTH_URL}
      GOOGLE_TOKEN_URL: ${GOOGLE_TOKEN_URL}
      GOOGLE_USERINFO_URL: ${GOOGLE_USERINFO_URL}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      NVIDIA_API_URL: ${NVIDIA_API_URL}
      LLM_MODEL: ${LLM_MODEL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL}
      OPENROUTER_MODEL1: ${OPENROUTER_MODEL1}
      OPENROUTER_MODEL2: ${OPENROUTER_MODEL2}
      OPENROUTER_MODEL3: ${OPENROUTER_MODEL3}
      OPENROUTER_API_URL: ${OPENROUTER_API_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      FEEDBACK_TO_EMAIL: ${FEEDBACK_TO_EMAIL}
    ports:
      - "8000:8000"
    depends_on:
      - redis

  frontend:
    image: ${DOCKER_IMAGE_FRONTEND:-noderift-frontend:latest}
    ports:
      - "3000:80"   
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    expose:
      - "6379"

  worker:
    image: ${DOCKER_IMAGE_WORKER:-noderift-worker:latest}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      FRONTEND_URL: ${FRONTEND_URL}
      GOOGLE_AUTH_URL: ${GOOGLE_AUTH_URL}
      GOOGLE_TOKEN_URL: ${GOOGLE_TOKEN_URL}
      GOOGLE_USERINFO_URL: ${GOOGLE_USERINFO_URL}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      NVIDIA_API_URL: ${NVIDIA_API_URL}
      LLM_MODEL: ${LLM_MODEL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL}
      OPENROUTER_MODEL1: ${OPENROUTER_MODEL1}
      OPENROUTER_MODEL2: ${OPENROUTER_MODEL2}
      OPENROUTER_MODEL3: ${OPENROUTER_MODEL3}
      OPENROUTER_API_URL: ${OPENROUTER_API_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      FEEDBACK_TO_EMAIL: ${FEEDBACK_TO_EMAIL}
    depends_on:
      - redis
      - backend
