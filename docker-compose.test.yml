services:
  backend:
    image: ${DOCKER_IMAGE_BACKEND:-noderift-backend:test}
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      FRONTEND_URL: ${FRONTEND_URL}
      GOOGLE_AUTH_URL: ${GOOGLE_AUTH_URL}
      GOOGLE_TOKEN_URL: ${GOOGLE_TOKEN_URL}
      GOOGLE_USERINFO_URL: ${GOOGLE_USERINFO_URL}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      NVIDIA_API_URL: ${NVIDIA_API_URL}
      LLM_MODEL: ${LLM_MODEL}
    ports:
      - "8001:8000"
    depends_on:
      - redis

  frontend:
    image: ${DOCKER_IMAGE_FRONTEND:-noderift-frontend:test}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
    ports:
      - "3001:80"   
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    expose:
      - "6379"

  worker:
    image: ${DOCKER_IMAGE_WORKER:-noderift-worker:test}
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      FRONTEND_URL: ${FRONTEND_URL}
      GOOGLE_AUTH_URL: ${GOOGLE_AUTH_URL}
      GOOGLE_TOKEN_URL: ${GOOGLE_TOKEN_URL}
      GOOGLE_USERINFO_URL: ${GOOGLE_USERINFO_URL}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      NVIDIA_API_URL: ${NVIDIA_API_URL}
      LLM_MODEL: ${LLM_MODEL}
    depends_on:
      - redis
      - backend
